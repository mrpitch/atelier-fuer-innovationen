<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="konstellationen-spektrum-title konstellationen-spektrum-desc">
	<title id="konstellationen-spektrum-title">Spektrum von Gütern und Leistungen in der gesellschaftlichen Entwicklung</title>
	<desc id="konstellationen-spektrum-desc">Ein nach oben schmaler werdendes Trapezschema, das Güter und Leistungen von Nahrungsmitteln (unten, Low-End) bis zu neuen Ingenieurleistungen an der vorderen Linie (oben, High-End) anordnet, flankiert von Pfeilen für Markterschließung durch fundamentale und inkrementale Innovation.</desc>
	<rect x="0" y="0" width="1000" height="680" fill="#ffffff" stroke="#7c3aed" stroke-width="10" />

	<text x="40" y="45" font-size="19" font-weight="700" fill="#1e1b4b">Spektrum von Gütern und Leistungen</text>
	<text x="40" y="68" font-size="14" fill="#4c1d95">in der gesellschaftlichen Entwicklung</text>
	<text x="950" y="45" text-anchor="end" font-size="16" font-weight="700" fill="#ea580c">✦ Xeniapolis</text>

	<text x="500" y="100" text-anchor="middle" font-size="12" fill="#1e1b4b">Politische Gestaltungsleistungen hoher Komplexität · Grundlagenforschung</text>
	<text x="500" y="120" text-anchor="middle" font-size="12" fill="#1e1b4b">Innovative Leistungen fundamentaler Art · Innovative Leistungen inkrementaler Art</text>
	<text x="500" y="140" text-anchor="middle" font-size="12" fill="#1e1b4b">Aktivitäten der Markterschließung</text>
	<text x="500" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">Ziel: Komparative Vorteile erringen und sichern!</text>

	
	<line x1="430" y1="230" x2="940" y2="230" stroke="#c4b5fd" stroke-width="1" />
	<text x="438" y="245.5625" font-size="11" fill="#1e1b4b">Nahrungsmittel</text>
	
	<line x1="409.3333333333333" y1="253.125" x2="940" y2="253.125" stroke="#c4b5fd" stroke-width="1" />
	<text x="417.3333333333333" y="268.6875" font-size="11" fill="#1e1b4b">Güter des täglichen Bedarfs</text>
	
	<line x1="388.6666666666667" y1="276.25" x2="940" y2="276.25" stroke="#c4b5fd" stroke-width="1" />
	<text x="396.6666666666667" y="291.8125" font-size="11" fill="#1e1b4b">Werkzeuge</text>
	
	<line x1="368" y1="299.375" x2="940" y2="299.375" stroke="#c4b5fd" stroke-width="1" />
	<text x="376" y="314.9375" font-size="11" fill="#1e1b4b">Förderung von Bodenschätzen</text>
	
	<line x1="347.3333333333333" y1="322.5" x2="940" y2="322.5" stroke="#c4b5fd" stroke-width="1" />
	<text x="355.3333333333333" y="338.0625" font-size="11" fill="#1e1b4b">Einfache Dienstleistungen</text>
	
	<line x1="326.6666666666667" y1="345.625" x2="940" y2="345.625" stroke="#c4b5fd" stroke-width="1" />
	<text x="334.6666666666667" y="361.1875" font-size="11" fill="#1e1b4b">Einfache Industriebauten</text>
	
	<line x1="306" y1="368.75" x2="940" y2="368.75" stroke="#c4b5fd" stroke-width="1" />
	<text x="314" y="384.3125" font-size="11" fill="#1e1b4b">Mittelkomplexe Industrieanlagen auf Basis beherrschbarer Techniken</text>
	
	<line x1="285.33333333333337" y1="391.875" x2="940" y2="391.875" stroke="#c4b5fd" stroke-width="1" />
	<text x="293.33333333333337" y="407.4375" font-size="11" fill="#1e1b4b">Unterhaltungsindustrie</text>
	
	<line x1="264.66666666666663" y1="415" x2="940" y2="415" stroke="#c4b5fd" stroke-width="1" />
	<text x="272.66666666666663" y="430.5625" font-size="11" fill="#1e1b4b">Infrastruktursysteme</text>
	
	<line x1="244" y1="438.125" x2="940" y2="438.125" stroke="#c4b5fd" stroke-width="1" />
	<text x="252" y="453.6875" font-size="11" fill="#1e1b4b">Software</text>
	
	<line x1="223.33333333333334" y1="461.25" x2="940" y2="461.25" stroke="#c4b5fd" stroke-width="1" />
	<text x="231.33333333333334" y="476.8125" font-size="11" fill="#1e1b4b">Industrielle und ingenieurtechnische Schlüsselkomponenten</text>
	
	<line x1="202.66666666666669" y1="484.375" x2="940" y2="484.375" stroke="#c4b5fd" stroke-width="1" />
	<text x="210.66666666666669" y="499.9375" font-size="11" fill="#1e1b4b">Komplexe Industrieanlagen / Ingenieurwerke mit Informatisierung, Systemintegration</text>
	
	<line x1="182" y1="507.5" x2="940" y2="507.5" stroke="#c4b5fd" stroke-width="1" />
	<text x="190" y="523.0625" font-size="11" fill="#1e1b4b">Wissensstädte und Datenautobahnen</text>
	
	<line x1="161.33333333333331" y1="530.625" x2="940" y2="530.625" stroke="#c4b5fd" stroke-width="1" />
	<text x="169.33333333333331" y="546.1875" font-size="11" fill="#1e1b4b">Ökologische Lösungen, Kreislauf-Produktionen</text>
	
	<line x1="140.66666666666669" y1="553.75" x2="940" y2="553.75" stroke="#c4b5fd" stroke-width="1" />
	<text x="148.66666666666669" y="569.3125" font-size="11" fill="#1e1b4b">Hoch-integrierte Infrastrukturen</text>
	
	<line x1="120" y1="576.875" x2="940" y2="576.875" stroke="#c4b5fd" stroke-width="1" />
	<text x="128" y="592.4375" font-size="11" fill="#1e1b4b">Neue Ingenieurleistungen an der vorderen Linie</text>
	

	<line x1="430" y1="230" x2="120" y2="600" stroke="#4c1d95" stroke-width="2" />
	<line x1="570" y1="230" x2="880" y2="600" stroke="#4c1d95" stroke-width="2" fill="none" />

	<g>
		<line x1="60" y1="600" x2="60" y2="230" stroke="#1e1b4b" stroke-width="2" marker-end="url(#arrow)" />
		<text x="30" y="415" font-size="10" fill="#1e1b4b" text-anchor="middle" transform="rotate(-90 30 415)">Erweiterung des Spektrums und</text>
		<text x="42" y="415" font-size="10" fill="#1e1b4b" text-anchor="middle" transform="rotate(-90 42 415)">Erschließung neuer Märkte</text>
		<text x="54" y="415" font-size="10" fill="#1e1b4b" text-anchor="middle" transform="rotate(-90 54 415)">durch fundamentale Innovation</text>
	</g>
	<g>
		<line x1="120" y1="630" x2="940" y2="630" stroke="#1e1b4b" stroke-width="2" marker-end="url(#arrow)" />
		<text x="530" y="652" text-anchor="middle" font-size="11" fill="#1e1b4b">Ausweitung der Märkte im vorhandenen Spektrum vom Low-End zum High-End durch inkrementale Innovationen</text>
	</g>

	<defs>
		<marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
			<path d="M0,0 L8,4 L0,8 Z" fill="#1e1b4b" />
		</marker>
	</defs>
</svg>
