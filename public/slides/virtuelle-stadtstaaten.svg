	<text x="1026" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12">Verantwortung für das Ganze</text>
	<text x="1026" y="169" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12">„Integration"</text>
	<text x="1026" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12"></text>
	<text x="1026" y="199" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12">Leit-Kulturen in Vielfalt</text>
	<text x="1026" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12">für Frieden und Freiheit</text>
	<rect x="876" y="259" width="300" height="135" fill="#fed7aa" stroke="#9a3412" stroke-width="1.5" rx="6" />
	<text x="1026" y="289" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12">Ganzheitlich ausgerichtete</text>
	<text x="1026" y="304" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12">Politik des Zivilen</text>
	<text x="1026" y="319" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12">„Zielerreichung"</text>
	<text x="1026" y="334" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12"></text>
	<text x="1026" y="349" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12">Wettbewerb von und in</text>
	<text x="1026" y="364" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12">Kooperation &amp; Anpassung</text>

	<rect x="24" y="414" width="1152" height="28" fill="#334155" stroke="#0f172a" stroke-width="1.5" rx="6" />
