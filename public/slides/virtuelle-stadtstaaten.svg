	<rect x="334" y="104" width="532" height="300" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5" rx="6" />
	<text x="600" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">Virtuelle StadtStaaten</text>
	<text x="600" y="156" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#334155" font-style="italic">Wagnisidee: „verrückt, aber wenn es gelänge …"</text>
	<text x="600" y="182" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#0f172a">1. Repräsentation offener Gesellschaften als „Res Publica"</text>
	<text x="600" y="204" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#0f172a">2. „VitaFutur" für die Sicherung der Lebensqualität aller (Maß VF)</text>
	<text x="600" y="226" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#0f172a">3. Es sind alle „zu Beteiligende"</text>
