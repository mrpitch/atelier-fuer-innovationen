<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="virtuelle-stadtstaaten-title virtuelle-stadtstaaten-desc">
	<title id="virtuelle-stadtstaaten-title">Virtuelle StadtStaaten</title>
	<desc id="virtuelle-stadtstaaten-desc">Übersichtsschema zum virtuellen StadtStaat: Gesellschaft als Ganzes nach dem AGIL-Schema, die virtuellen StadtStaaten als Repräsentation offener Gesellschaften mit dem Maß VitaFutur, eingebettet in eine Mitwelt mit vier Gesellschaftsschichten, acht Stadtvierteln und Pavillon-Park, zwischen Erster und Zweiter Moderne im großen Übergang 1800 bis 2200.</desc>
