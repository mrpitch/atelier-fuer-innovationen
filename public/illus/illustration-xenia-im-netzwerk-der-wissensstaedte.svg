<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="xenia-netzwerk-title xenia-netzwerk-desc">
	<title id="xenia-netzwerk-title">Xenia im Netzwerk der Wissensstädte</title>
	<desc id="xenia-netzwerk-desc">Schematische Landkarte: Xenia als ummauerte Wissensstadt im Zentrum, verbunden über Wege mit weiteren Wissensstädten und einer Hafenstadt in der näheren und weiteren Umgebung, umgeben von Gebirge, Wald und Meer.</desc>

	<rect x="0" y="0" width="900" height="700" fill="#f6efdc" stroke="#8a6d3b" stroke-width="6" />
	<rect x="10" y="10" width="880" height="680" fill="none" stroke="#c7a76a" stroke-width="1.5" stroke-dasharray="4 4" />

	<text x="450" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#4a2e0a">Xenia im Netzwerk der Wissensstädte</text>

	<!-- mountains, top-left -->
	<g fill="#9ca3af" stroke="#4b5563" stroke-width="1">
		<path d="M50 180 L90 110 L130 180 Z" />
		<path d="M100 180 L140 95 L185 180 Z" />
		<path d="M160 180 L195 125 L230 180 Z" />
	</g>
	<text x="140" y="200" text-anchor="middle" font-size="11" fill="#4b5563">Gebirge</text>

	<!-- forest, bottom-left -->
