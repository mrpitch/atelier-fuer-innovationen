	<path d="M 612.0729309053138 621.7456132866976 h20 M 614.0729309053138 615.7456132866976 l8 -8 l8 8" fill="none" stroke="#92400e" stroke-width="1.5" />
	<text x="622.0729309053138" y="663.7456132866976" text-anchor="middle" font-size="11" font-weight="600" fill="#5b3a1a">Hafenstadt</text>
	<text x="622.0729309053138" y="676.7456132866976" text-anchor="middle" font-size="11" font-weight="600" fill="#5b3a1a">am Meer</text>
	
