		<path d="M0,-26 L6,0 L0,26 L-6,0 Z" fill="#b91c1c" />
		<path d="M-26,0 L0,6 L26,0 L0,-6 Z" fill="#4a2e0a" />
		<text y="-34" text-anchor="middle" font-size="11" font-weight="700" fill="#4a2e0a">N</text>
