	<text x="257.1637170940382" y="647.8133329356934" text-anchor="middle" font-size="11" font-weight="600" fill="#5b3a1a">Wissensstadt</text>
	<text x="257.1637170940382" y="660.8133329356934" text-anchor="middle" font-size="11" font-weight="600" fill="#5b3a1a">Süd</text>
	
	<circle cx="168.0922137642275" cy="277.39395700229943" r="22" fill="#fef3c7" stroke="#92400e" stroke-width="2" />
	<path d="M 158.0922137642275 273.39395700229943 h20 M 160.0922137642275 267.39395700229943 l8 -8 l8 8" fill="none" stroke="#92400e" stroke-width="1.5" />
	<text x="168.0922137642275" y="315.39395700229943" text-anchor="middle" font-size="11" font-weight="600" fill="#5b3a1a">Wissensstadt</text>
	<text x="168.0922137642275" y="328.39395700229943" text-anchor="middle" font-size="11" font-weight="600" fill="#5b3a1a">West</text>
	

	<text x="450" y="688" text-anchor="middle" font-size="10" fill="#6b5431">Schematische Darstellung — Örtlichkeiten der näheren und weiteren Umgebung, über Wege zu einem Netzwerk der Wissensstädte verknüpft</text>
</svg>
