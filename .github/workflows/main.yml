name: Deploy Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # Don't install the git hooks (husky's prepare script) on the runner.
  HUSKY: 0

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install modules
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  validate-okf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install modules
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Validate OKF frontmatter conformance
        run: pnpm validate:okf

  deploy:
    # A pull request runs the checks only; publishing is for pushes to main.
    if: github.event_name == 'push'
    needs: [quality, validate-okf]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_S3_REGION }}
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install modules
        run: pnpm install
      - name: Build application
        run: pnpm build
      - name: Deploy to S3
        run: aws s3 sync ./out/ s3://${{ vars.AWS_S3_BUCKET_NAME }}
      - name: Create CloudFront invalidation
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CF_DISTRIBUTION_ID }} --paths "/*"
