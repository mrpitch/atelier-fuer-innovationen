name: Deploy Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # Don't install the git hooks (husky's prepare script) on the runner.
  HUSKY: 0

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      content: ${{ steps.filter.outputs.content }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            content:
              - 'src/content/docs/**'
              - 'src/data/**'
              - 'public/**'

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install modules
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  validate-okf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install modules
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Validate OKF frontmatter conformance
        run: pnpm validate:okf

  validate-content:
    needs: check-changes
    if: needs.check-changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install modules
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Validate content integrity
        run: pnpm validate:content

  build-check:
    needs: check-changes
    if: needs.check-changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install modules
        run: pnpm install --frozen-lockfile
      - name: Build and capture output
        run: pnpm build 2>&1 | tee build.log
      - name: Fail on known missing-image / unresolved-link warning signatures
        run: |
          # Pinned warning strings — each verified against this repo's actual
          # source rather than guessed:
          #
          # "Module not found: Can't resolve"
          #   Webpack/Next.js's own diagnostic when an import can't be
          #   resolved. Fumadocs' remarkImage preset (enabled by default; see
          #   the remarkImageOptions handling in
          #   fumadocs-core/dist/content/mdx/preset-bundler.js) rewrites every
          #   relative/absolute MDX image reference into a static `import`, so
          #   a broken image path in content fails the build with exactly this
          #   string.
          #
          # "Error loading illus:" / "Error loading slides:"
          #   Literal console.error prefixes in src/components/illus.tsx and
          #   src/components/slides.tsx, logged when the dynamic import of
          #   src/data/illus.json or slides.json throws during that async
          #   server component's render, which Next executes for every page
          #   during the static export build.
          PATTERN="Module not found: Can't resolve|Error loading illus:|Error loading slides:"
          if grep -E "$PATTERN" build.log; then
            echo "::error::Build produced a missing-image / unresolved-link warning (see above)"
            exit 1
          fi

  deploy:
    # A pull request runs the checks only; publishing is for pushes to main.
    # validate-content and build-check are skipped when no content changed,
    # and a skipped `needs` job would skip this one too — so gate on "nothing
    # failed" explicitly instead of relying on the implicit success().
    if: >-
      github.event_name == 'push' && !cancelled() &&
      !contains(needs.*.result, 'failure')
    needs: [quality, validate-okf, validate-content, build-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_S3_REGION }}
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install modules
        run: pnpm install
      - name: Build application
        run: pnpm build
      - name: Deploy to S3
        run: aws s3 sync ./out/ s3://${{ vars.AWS_S3_BUCKET_NAME }}
      - name: Create CloudFront invalidation
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CF_DISTRIBUTION_ID }} --paths "/*"
