# Agent skill config — schema: ~/Dev/home/schemas/agents.schema.json
version: 1
project:
  name: atelier-fuer-innovationen
  description: Next.js + Fumadocs content site
  locale: de
  type: single-package
stack:
  framework: Next.js 16 (static export)
  testRunner: node --test via tsx
  libraries: [Fumadocs, Tailwind CSS 4]
  logging: console.log
paths:
  sourceRoots: [src/app, src/lib, src/components, src/data]
commands:
  format: pnpm format
  lint: pnpm lint
  typecheck: pnpm typecheck
  test: pnpm test
  build: pnpm build
  check: pnpm typecheck && pnpm lint
  docsCheck: pnpm validate:okf
git:
  trunk: main
  branchPrefix:
    feature: feat/
    epic: epic/
    security: hotfix/security-update-
tracker:
  type: github
  prsAreRequests: false
labels:
  epic: epic
  readyForAgent: afk
  readyForHuman: hitl
  needsTriage: needs-triage
  needsInfo: needs-info
  wontfix: wontfix
workflow:
  autoMergeAfkSubissues: true
  projectStatus:
    number: 11
release:
  versionBumpCommand: 'pnpm version {level} --no-git-tag-version'
sandbox:
  checkCommand: pnpm typecheck && pnpm lint
docs:
  layout: diataxis
  glossary: docs/reference/glossary.md
  adrDir: docs/architecture/09-decisions
  excludedFolders:
    - docs/research
    - docs/audit-reports
    - .sandcastle
    - src/content/docs
    - out
    - .next
    - .source
  notes: [docs/agents/domain.md]
  conventions:
    - "`CLAUDE.md` points to `AGENTS.md`; treat `AGENTS.md` as the source of truth."
    - "Folder names follow the `docs` skill: `tutorials/`, alongside `how-to/`, `reference/`, `explanation/`; ADRs live in `architecture/09-decisions/`, with `reference/glossary.md` as the domain vocabulary file. Use these names when scaffolding."
    - "Frontmatter follows the `docs` skill contract: lowercase `type` (the Diataxis quadrant), `title`, `description`, `tags`, `status: stable | draft | deprecated`. The `type` field doubles as the OKF `type` that `pnpm validate:okf` requires; see `docs/agents/domain.md`."
